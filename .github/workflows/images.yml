name: Publish runner image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/images.yml
      - github-actions-runner/**
      - README.md
  workflow_dispatch:
    inputs:
      runner_version:
        description: GitHub Actions runner version to package
        required: false
        default: "2.335.1"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runner-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: riffingonsoftware/github-actions-runner
  DEFAULT_RUNNER_VERSION: "2.335.1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set build variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.runner_version || env.DEFAULT_RUNNER_VERSION }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid runner_version: $version" >&2
            exit 1
          fi
          echo "runner_version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.runner_version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=GitHub Actions runner
            org.opencontainers.image.description=Self-hosted GitHub Actions runner image for local runners
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./github-actions-runner
          push: true
          build-args: |
            RUNNER_VERSION=${{ steps.vars.outputs.runner_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
